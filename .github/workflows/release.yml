name: Release Workflow

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: 🚀 PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Ensure published packages are tagged
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for pkg_json in packages/*/package.json; do
            if [ "$(jq -r '.private // false' "$pkg_json")" = "true" ]; then
              continue
            fi
            name=$(jq -r '.name' "$pkg_json")
            version=$(jq -r '.version' "$pkg_json")
            tag="$name@$version"

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
              continue
            fi
            if ! npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$tag not on npm yet, skipping"
              continue
            fi

            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null 2>&1; then
              echo "$tag exists locally but not on origin — pushing"
              git push origin "$tag"
            else
              echo "$tag is published on npm but untagged — creating and pushing it now"
              git tag -a "$tag" -m "$tag"
              git push origin "$tag"
            fi
          done
