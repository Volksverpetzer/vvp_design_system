name: Release Workflow

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: 🚀 PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Ensure published packages are tagged
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for pkg_json in packages/*/package.json; do
            if [ "$(jq -r '.private // false' "$pkg_json")" = "true" ]; then
              continue
            fi
            name=$(jq -r '.name' "$pkg_json")
            version=$(jq -r '.version' "$pkg_json")
            tag="$name@$version"

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
              continue
            fi

            npm_output=$(npm view "$name@$version" version 2>&1)
            npm_status=$?
            if [ $npm_status -ne 0 ]; then
              if echo "$npm_output" | grep -q "E404"; then
                echo "$tag not on npm yet, skipping"
                continue
              fi
              echo "npm view failed unexpectedly for $tag, failing instead of assuming it's unpublished:"
              echo "$npm_output"
              exit 1
            fi

            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null 2>&1; then
              echo "$tag exists locally but not on origin — pushing"
              git push origin "$tag"
              continue
            fi

            # Tag the commit that actually introduced this version, not opportunistically
            # whatever commit this workflow run happens to be checked out at — a later,
            # unrelated push could otherwise steal the tag onto the wrong commit.
            # -S matches commits that added OR removed the line, so once a later commit
            # bumps past $version, the most recent hit is that later (removing) commit —
            # filter to the hit that actually added the line.
            commit=""
            for candidate in $(git log --format=%H -S"\"version\": \"$version\"" -- "$pkg_json"); do
              if git show "$candidate" -- "$pkg_json" | grep -E '^\+[^+]' | grep -qF "\"version\": \"$version\""; then
                commit="$candidate"
                break
              fi
            done
            if [ -z "$commit" ]; then
              echo "$tag is published on npm but no commit in history sets that exact version in $pkg_json — skipping rather than guessing"
              continue
            fi

            echo "$tag is published on npm but untagged — creating it at $commit and pushing"
            git tag -a "$tag" -m "$tag" "$commit"
            git push origin "$tag"
          done
