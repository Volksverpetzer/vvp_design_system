name: Release Workflow

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: 🚀 PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Ensure published packages are tagged
        run: |
          packages='${{ steps.changesets.outputs.publishedPackages }}'
          if [ -z "$packages" ] || [ "$packages" = "[]" ]; then
            echo "No published packages reported, nothing to tag"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$packages" | jq -c '.[]' | while read -r pkg; do
            name=$(echo "$pkg" | jq -r '.name')
            version=$(echo "$pkg" | jq -r '.version')
            tag="$name@$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
              echo "Tag $tag already exists on origin, skipping"
            elif git rev-parse -q --verify "refs/tags/$tag" > /dev/null 2>&1; then
              echo "changeset publish already created $tag locally but didn't push it — pushing now"
              git push origin "$tag"
            else
              echo "Tag $tag missing entirely — creating and pushing it now"
              git tag -a "$tag" -m "$tag"
              git push origin "$tag"
            fi
          done
